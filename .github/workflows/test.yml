name: ros2_tracing
on:
  pull_request:
  push:
    branches:
      - rolling
  schedule:
    - cron: "0 5 * * *"
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}
    continue-on-error: ${{ matrix.build-type == 'binary' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Normal build (binary)
          - os: ubuntu:26.04
            distro: rolling
            build-type: binary
            instrumentation: instr-enabled
            tracepoints: tp-included
          # Normal build (source)
          - os: ubuntu:26.04
            distro: rolling
            build-type: source
            instrumentation: instr-enabled
            tracepoints: tp-included
          # Build with instrumentation disabled
          - os: ubuntu:26.04
            distro: rolling
            build-type: source
            instrumentation: instr-disabled
            tracepoints: tp-included
          # Normal build with tracepoints excluded
          - os: ubuntu:26.04
            distro: rolling
            build-type: source
            instrumentation: instr-enabled
            tracepoints: tp-excluded
    env:
      ROS2_REPOS_FILE_URL: 'https://raw.githubusercontent.com/ros2/ros2/${{ matrix.distro }}/ros2.repos'
    steps:
    - uses: actions/checkout@v6
    - uses: ros-tooling/setup-ros@main
      with:
        required-ros-distributions: ${{ matrix.build-type == 'binary' && matrix.distro || '' }}
        use-ros2-testing: true
    # Pin Fast-DDS to a known-good commit to work around a GCC 15 -Werror=maybe-uninitialized
    # build failure introduced by https://github.com/eProsima/Fast-DDS/pull/6370 on the 3.6.x branch.
    - name: Pin Fast-DDS commit
      if: matrix.build-type == 'source'
      run: |
        curl -sL "${ROS2_REPOS_FILE_URL}" -o ros2.repos.upstream
        python3 - <<'PY'
        import yaml
        with open('ros2.repos.upstream') as f:
            data = yaml.safe_load(f)
        data['repositories']['eProsima/Fast-DDS']['version'] = '621f6d8267708d6ca311af880ad3f6820271e6a4'
        with open('ros2.repos.pinned', 'w') as f:
            yaml.safe_dump(data, f)
        PY
        echo "ROS2_REPOS_FILE_URL=${GITHUB_WORKSPACE}/ros2.repos.pinned" >> "${GITHUB_ENV}"
    - uses: ros-tooling/action-ros-ci@main
      with:
        package-name: >
          lttngpy
          ros2trace
          test_ros2trace
          test_tracetools
          test_tracetools_launch
          tracetools
          tracetools_launch
          tracetools_read
          tracetools_test
          tracetools_trace
        target-ros2-distro: ${{ matrix.distro }}
        vcs-repo-file-url: ${{ matrix.build-type == 'source' && env.ROS2_REPOS_FILE_URL || '' }}
        extra-cmake-args: >
          ${{ endsWith(matrix.instrumentation, '-disabled') && '-DTRACETOOLS_DISABLED=ON' || '' }}
          ${{ endsWith(matrix.tracepoints, '-excluded') && '-DTRACETOOLS_TRACEPOINTS_EXCLUDED=ON' || '' }}
        colcon-defaults: |
          {
            "build": {
              "mixin": [
                "coverage-gcc",
                "coverage-pytest"
              ]
            },
            "test": {
              "mixin": [
                "coverage-pytest"
              ],
              "executor": "sequential",
              "retest-until-pass": 2,
              "ctest-args": ["-LE", "xfail"],
              "pytest-args": ["-m", "not xfail"]
            }
          }
    - name: Make sure tracing instrumentation is available
      run: |
        source ros_ws/install/setup.bash
        ./ros_ws/build/tracetools/status
      if: endsWith(matrix.instrumentation, '-enabled') && endsWith(matrix.tracepoints, '-included')
    - name: Make sure tracing instrumentation is disabled
      run: |
        source ros_ws/install/setup.bash
        (! ./ros_ws/build/tracetools/status)
      if: endsWith(matrix.instrumentation, '-disabled') || endsWith(matrix.tracepoints, '-excluded')
    - uses: codecov/codecov-action@v3
      with:
        files: ros_ws/lcov/total_coverage.info,ros_ws/coveragepy/.coverage
